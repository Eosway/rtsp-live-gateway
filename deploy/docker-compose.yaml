services:
  server:
    image: rtsp-live-gateway-server:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      ENABLE_HTTPS: 'false'
      HTTP2_ALLOW_HTTP1: 'true'
    #   TLS_CERT_PATH: '/run/certs/tls.crt'
    #   TLS_KEY_PATH: '/run/certs/tls.key'
    #   LOG_LEVEL: 'info'
    #   FFMPEG_PATH: 'ffmpeg'
    #   FFPROBE_PATH: 'ffprobe'
    #   FFMPEG_DECODER: 'auto'
    #   FFMPEG_ENCODER: 'auto'
    #   FFMPEG_HARDWARE_TEMPLATE: 'nvidia'
    #   STREAM_STARTUP_TIMEOUT_MS: '8000'
    #   STREAM_IDLE_GRACE_MS: '15000'
    #   STOP_GRACE_MS: '1500'
    #   MAX_QUEUE_BYTES: '2097152'
    #   MAX_SOURCES: '64'
    #   MAX_VIEWERS_PER_SOURCE: '256'
    #   SSRF_ALLOW_PRIVATE_IP: 'true'
    #   RTSP_HOST_DENYLIST: 'localhost,127.0.0.1,::1'
    #   RTSP_PORT_ALLOWLIST: '554,8554'
    # volumes:
    #   - ./certs:/run/certs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const httpsEnabled=(process.env.ENABLE_HTTPS ?? 'false').toLowerCase() === 'true'; const port=Number(process.env.PORT ?? '3000'); if (httpsEnabled) { const { connect } = require('node:http2'); const client = connect(`https://127.0.0.1:${port}`, { rejectUnauthorized: false }); client.on('error', () => process.exit(1)); const req = client.request({ ':path': '/v1/healthz', ':method': 'GET' }); req.on('response', (headers) => { const status = Number(headers[':status'] ?? 500); client.close(); process.exit(status >= 200 && status < 300 ? 0 : 1) }); req.on('error', () => { client.close(); process.exit(1) }); req.setEncoding('utf8'); req.resume(); req.end(); } else { const protocol=require('node:http'); const req=protocol.request({ host:'127.0.0.1', port, path:'/v1/healthz', method:'GET' }, (res) => { process.exit((res.statusCode ?? 500) >= 200 && (res.statusCode ?? 500) < 300 ? 0 : 1) }); req.on('error', () => process.exit(1)); req.end(); }",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
